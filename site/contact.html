<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Your Trip</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --border: #d0d4da;
      --accent: #0b6e69;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .intro { margin: 0 0 24px; color: var(--muted); }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: grid;
      gap: 16px;
    }
    .row { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 4px; }
    label { font-weight: 600; font-size: 0.9rem; }
    .optional { font-weight: 400; color: var(--muted); }
    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      justify-self: start;
    }
    .honeypot { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <main>
    <h1>Plan your trip</h1>
    <p class="intro">Tell me a bit about the trip you have in mind and I'll get back to you with ideas and options.</p>

    <form name="trip-inquiry" method="POST" action="/thanks.html" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="trip-inquiry" />
      <!-- Honeypot: bots fill this in, Netlify discards those submissions -->
      <p class="honeypot" aria-hidden="true">
        <label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
      </p>

      <div class="row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="optional">(optional)</span></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" />
      </div>

      <div class="field">
        <label for="destination">Where would you like to go?</label>
        <input type="text" id="destination" name="destination" placeholder="e.g. Italy, a Caribbean cruise, not sure yet" required />
      </div>

      <div class="row">
        <div class="field">
          <label for="depart_date">Departure date <span class="optional">(approx.)</span></label>
          <input type="date" id="depart_date" name="depart_date" />
        </div>
        <div class="field">
          <label for="return_date">Return date <span class="optional">(approx.)</span></label>
          <input type="date" id="return_date" name="return_date" />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="travelers">Number of travelers</label>
          <input type="number" id="travelers" name="travelers" min="1" value="2" required />
        </div>
        <div class="field">
          <label for="budget">Budget per person</label>
          <select id="budget" name="budget">
            <option value="">Prefer not to say</option>
            <option>Under $2,000</option>
            <option>$2,000 – $5,000</option>
            <option>$5,000 – $10,000</option>
            <option>$10,000+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="message">Anything else I should know?</label>
        <textarea id="message" name="message" placeholder="Occasion, travel style, must-sees, flexibility on dates…"></textarea>
      </div>

      <button type="submit">Send inquiry</button>
    </form>
  </main>
</body>
</html>
